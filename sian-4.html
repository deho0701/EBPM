<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>한의약 EBP DB 시안 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --out:#f6f7f8; --bg:#ffffff; --ink:#1f2328; --ink-2:#4b5159; --ink-3:#868c96; --line:#e8eaed; --line-2:#dcdfe3; --sel:#f1f2f4;
  --sky:#e2f1fa; --sky-b:#7fc0e4; --sky-btn:#8ccdf0; --grn:#e3f3e6; --grn-b:#7cc293;
  --m1:#6aa383; --m2:#6c93bb; --m3:#bf9f68; --m4:#c27d76; --m5:#9aa1ab;
  --pop-shadow:0 4px 16px rgba(17,24,39,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--out);color:var(--ink);font-family:"Inter","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky-b);outline-offset:1px}
.wrap{padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.app{display:grid;grid-template-columns:160px minmax(0,1fr);min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;min-height:calc(100vh - 80px)}

/* 사이드바 */
.side{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:12px}
.logo{display:flex;align-items:center;gap:6px;padding:2px 6px;font-weight:500;font-size:13px;white-space:nowrap}
.logo small{font-size:11px;font-weight:500;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.dsel{position:relative}
.dsel select{width:100%;appearance:none;-webkit-appearance:none;height:30px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg);padding:0 22px 0 8px;font-size:12px;font-weight:500;text-overflow:ellipsis}
.dsel::after{content:"";position:absolute;right:9px;top:12px;width:5px;height:5px;border-right:1.3px solid var(--ink-3);border-bottom:1.3px solid var(--ink-3);transform:rotate(45deg);pointer-events:none}
.newbtn{height:28px;border:0;border-radius:6px;background:var(--sky-btn);color:var(--ink);font-size:12px;font-weight:500}
.newbtn:hover{filter:brightness(.97)}
.nav{display:flex;flex-direction:column;gap:1px;margin-top:4px}
.nav span{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:6px;color:var(--ink-2);white-space:nowrap}
.nav span{cursor:pointer}
.nav span.cur{background:var(--sel);color:var(--ink);font-weight:500}
.nav svg{flex:none;color:var(--ink-2)}
.nav .gapv{height:10px}
.upg{margin-top:auto;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;color:var(--ink-3)}
.upg b{display:block;color:var(--ink);font-weight:500;margin-bottom:2px}
.side .bot span{display:flex;align-items:center;gap:8px;height:26px;padding:0 8px;color:var(--ink-2)}

/* 본문 */
.main{min-width:0;display:flex;flex-direction:column}
.top{height:50px;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:14px;font-weight:500;flex:1}
.srch{display:flex;align-items:center;gap:6px;height:30px;width:260px;border:1px solid var(--line-2);border-radius:6px;padding:0 8px;color:var(--ink-3)}
.srch input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:12px}
.user{display:flex;align-items:center;gap:8px;color:var(--ink-2);white-space:nowrap}
.user .av{width:24px;height:24px;border-radius:50%;background:var(--sel);display:grid;place-items:center;font-size:11px;font-weight:500;color:var(--ink)}
.body{padding:14px 18px;min-width:0}

.sum{border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.sum h2{margin:0;font-size:13px;font-weight:500}
.sum h2 span{font-weight:400;color:var(--ink-3)}
.sbar{display:flex;gap:3px;height:3px;margin:10px 0 12px}
.sbar i{border-radius:2px}
.nums{display:grid;grid-template-columns:repeat(5,1fr)}
.nums b{display:block;font-size:18px;font-weight:500;line-height:1.2}
.nums span{font-size:11px;color:var(--ink-3);display:block;margin-top:2px}

.tools{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.tools .srch{width:150px;height:28px}
.tb{height:28px;padding:0 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg);font-size:12px;font-weight:500}
.tb:hover{background:var(--sel)}
.range{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;padding:0 4px;color:var(--ink)}
.range span{color:var(--ink-3)}
.lg{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink-2)}
.lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.lg i.s{background:var(--sky);box-shadow:inset 2px 0 0 var(--sky-b)}
.lg i.g{background:var(--grn);box-shadow:inset 2px 0 0 var(--grn-b)}
.lg i.e{border:1px solid var(--line-2)}
.lg em{font-style:normal;color:var(--line-2)}
.sp{flex:1}
.unit{display:flex;gap:2px;font-size:12px}
.unit button{height:28px;padding:0 10px;border:0;background:none;color:var(--ink-3);border-radius:6px}
.unit button[aria-pressed="true"]{color:var(--ink);font-weight:500;background:var(--sel)}
.unit button:disabled{opacity:.4;cursor:not-allowed}
.fpanel{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--ink-2)}
.fpanel label{display:flex;align-items:center;gap:6px}
.fpanel select{height:28px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg);font-size:12px;padding:0 6px}
.guide{margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;display:grid;grid-template-columns:1fr 1fr;gap:24px;font-size:12px}
.guide dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.guide dt{font-weight:500;white-space:nowrap}.guide dd{margin:0;color:var(--ink-2)}
.note{margin:10px 0 0;font-size:12px;color:var(--ink-3)}

/* 홈 */
.path{font-weight:400;font-size:12px;color:var(--ink-3);margin-left:8px}
.path button{border:0;background:none;padding:0;color:var(--ink-3);font-size:12px}
.path button:hover{color:var(--ink);text-decoration:underline}
.hcard{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:12px}
.hcard h2{margin:0 0 10px;font-size:13px;font-weight:500}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stp>small{display:block;font-size:11px;color:var(--ink-3);margin-bottom:6px}
.opt{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px;font-size:12px}
.opt:hover{background:var(--out)}
.opt.on{background:var(--sel);font-weight:500}
.opt .c{color:var(--ink-3);font-weight:400}
.hint{font-size:12px;color:var(--ink-3);padding:6px 8px}
.hact{display:flex;justify-content:flex-end;margin-top:12px}
.hact .newbtn{padding:0 16px}
.newbtn:disabled{opacity:.4;cursor:not-allowed}
.hh,.hrow{display:grid;grid-template-columns:190px minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start;padding:8px}
.hh{font-size:12px;color:var(--ink-3);border-bottom:1px solid var(--line);align-items:center}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}.hrow:hover{background:var(--out)}
.hrow .dn{display:flex;justify-content:space-between;gap:8px}.hrow .dn span{color:var(--ink-3)}
.s5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.s5 .bk{height:10px;border-radius:2px;background:var(--line);overflow:hidden}.s5 .bk i{display:block;height:100%}
.s5 small,.tn{display:block;margin-top:3px;font-size:10.5px;color:var(--ink-3)}
.stk{display:flex;gap:1px;height:10px}.stk i{border-radius:1px}
.cells{flex:none;display:flex}
.cells b{width:14px;height:14px;border:1px solid var(--line-2);margin-left:-1px;display:grid;place-items:center;font-size:9px;font-weight:500;line-height:1;color:#fff}
.cells b:first-child{margin-left:0}
.cells.ty b.y{background:#4b5159;border-color:#4b5159}
.tys{display:flex;align-items:center;gap:8px;margin-top:8px}.tys .tyl{margin:0;flex:none}.tys .stk{flex:1;height:6px;max-width:240px}
.tools select{height:28px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg);font-size:12px;font-weight:500;padding:0 6px}
.tools .lgr{flex-basis:100%}
.tyl{margin-top:8px;font-size:11px;color:var(--ink-3)}
.mk{flex:none;display:flex;gap:2px;font-size:12px;letter-spacing:0}
.mk b{font-weight:400;color:var(--ink)}.mk b.n{color:var(--line-2)}
.vl{flex:none;width:1px;height:14px;background:var(--line-2);margin:0 4px}
.hd .c0 small{margin-left:auto;font-size:10.5px;display:inline}

/* 표 */
.tbl{margin-top:12px;border-top:1px solid var(--line);overflow-x:auto}
.tg{min-width:calc(360px + var(--n) * var(--cw))}
.r{display:flex;min-height:30px}
.c0{flex:none;width:360px;position:sticky;left:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:6px;padding:0 8px 0 2px;min-width:0}
.tk{flex:1;position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(var(--cw),1fr))}
.tk>i{border-left:1px solid var(--line)}
.hd{border-bottom:1px solid var(--line)}
.hd .c0{font-size:12px;color:var(--ink-3)}
.hd .tk>div{border-left:1px solid var(--line);padding:6px 6px;line-height:1.3}
.hd b{display:block;font-size:12px;font-weight:500}
.hd small{display:block;font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.bar.u{background:var(--bg);box-shadow:none;border:1px solid var(--line-2);justify-content:center}
.bar.u .n{color:var(--ink-2)}
.grp .c0{font-weight:500;font-size:12px;padding-top:12px;width:auto;white-space:nowrap}
.grp .c0 span{font-weight:400;color:var(--ink-3)}
.grp{min-height:34px}
.row .c0 .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .c0 .st{flex:none;font-size:10.5px;color:var(--ink-3);letter-spacing:0}
.row:hover .c0,.row:hover{background:var(--out)}
.bar{position:absolute;top:5px;height:20px;display:flex;align-items:center;gap:6px;padding:0 6px 0 5px;border:0;border-radius:4px;background:var(--sky);box-shadow:inset 2px 0 0 var(--sky-b);font-size:12px;text-align:left;overflow:hidden;z-index:1;min-width:0}
.bar.g{background:var(--grn);box-shadow:inset 2px 0 0 var(--grn-b)}
.bar:hover,.bar.on{outline:1px solid var(--ink-3);outline-offset:-1px}
.bar .ch{flex:none;font-size:11px;font-weight:400;color:var(--ink-2)}
.bar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .n{flex:none;color:var(--ink-3);font-size:11px}
.unkr{min-height:30px}
.empty{padding:40px;text-align:center;color:var(--ink-3)}

/* 팝업 */
.pop{position:fixed;z-index:20;width:300px;max-height:360px;overflow:auto;background:var(--bg);border:1px solid var(--line-2);border-radius:6px;box-shadow:var(--pop-shadow);padding:12px;font-size:12px}
.pop .h{display:flex;align-items:center;gap:6px;font-weight:500}
.pop .h .ch{font-size:11px;color:var(--ink-2);font-weight:400}
.pop .meta{color:var(--ink-3);margin-top:2px}
.pop .k{margin-top:8px;color:var(--ink-3)}
.pop ul{list-style:none;margin:8px 0 0;padding:0}
.pop li{padding:6px 0;border-top:1px solid var(--line)}
.pop li b{font-weight:500}
.pop li p{margin:2px 0 0;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.pop li small{color:var(--ink-3)}
.pop .more{margin-top:6px;color:var(--ink-3)}
.pop .x{float:right;border:0;background:none;color:var(--ink-3);font-size:14px;line-height:1;padding:2px 4px}

/* 목록 */
.lt{width:100%;border-collapse:collapse;min-width:900px}
.lt th{font-size:12px;font-weight:500;color:var(--ink-3);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.lt td{padding:7px 8px;border-bottom:1px solid var(--line)}
.lt td.c,.lt th.c{text-align:center}
.lt .nm{max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt .y{color:var(--ink)}.lt .no{color:var(--line-2)}
.plan5{padding:48px;text-align:center;color:var(--ink-2)}
.plan5 b{display:block;color:var(--ink);font-size:13px;font-weight:500;margin-bottom:6px}
.foot{margin:12px 2px 0;font-size:12px;color:var(--ink-3);line-height:1.6;max-width:1100px}
/* 막대 */
:root{--m1:#3f8a56;--m2:#3b74b8;--m3:#b58516;--m4:#6a56b3;--m5:#b0477a}
.cells b{width:18px;height:18px;font-size:11px;font-weight:500;color:#a8adb5;border-color:#c5c9d0}
.cells b.y{color:#fff;font-weight:700}
.cells.ty b.y{background:#3a3f46;border-color:#3a3f46}
.r{min-height:34px}
.c0{gap:8px}
.bar{top:7px;height:20px;border-radius:3px;font-weight:500}
.bar .t,.bar .ch,.bar .n{color:#fff}
.bar.u,.bar.u .n{color:var(--ink-2)}
.bar:hover,.bar.on{outline:2px solid #111;outline-offset:0}
.s5 .bk{height:12px}
.s5 small,.tn{font-size:12px}
/* 과제 줄 표시 */
.cells{gap:0}
.cells b{border:0!important;background:none!important;width:15px;height:18px;margin-left:0;font-size:12.5px;font-weight:400;color:#cdd1d6;font-variant-numeric:tabular-nums}
.cells b.y,.cells.ty b.y{background:none!important;color:#1f2328;font-weight:700}
.vl{margin:0 9px;height:12px;background:#dfe2e6}
</style>

<div class="wrap">
<div class="app">
  <aside class="side">
    <div class="logo">한의약 EBP DB <small>초안</small></div>
    <div class="dsel" id="dsel"><select id="sel-dom" aria-label="2단계 도메인"></select></div>
    <button type="button" class="newbtn" id="b-guide">판정기준 보기</button>
    <nav class="nav" aria-label="메뉴">
      <span id="nav-home"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 6.5L7 2l5 4.5V12H2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>홈</span>
      <span id="nav-tl"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 4h7M2 7h10M2 10h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>과제 연표</span>
      <span id="nav-crit"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 7l1.5 1.5L9 5.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>판정기준</span>
    </nav>
  </aside>

  <div class="main">
    <div class="top">
      <h1><span id="ttl">과제</span></h1>
      <label class="srch" for="q"><svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8.5 8.5l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="과제명, 과제 ID 검색" autocomplete="off"></label>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="color:var(--ink-2)"><path d="M4 11.5V7a4 4 0 018 0v4.5l1.2 1.2H2.8z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.6 14.3h2.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <div class="user"><span class="av">연</span>연구진 <svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path d="M1.5 3l2.5 2.5L6.5 3" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></div>
    </div>
    <div class="body">
      <div id="home"></div>
      <div id="dview">
      <section class="sum" id="sum"></section>
      <div class="tools">
        <label class="srch" for="q2"><svg width="12" height="12" viewBox="0 0 13 13" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8.5 8.5l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><input id="q2" type="search" placeholder="과제 찾기" autocomplete="off"></label>
        <button type="button" class="tb" id="b-all">전체</button>
        <div class="range"><span>‹</span><b id="rng">2001 – 2025</b><span>›</span></div>
        <label>종합계획 <select id="sel-cha"></select></label>
        <label>도달단계 <select id="sel-stg"></select></label>
        <label>근거유형 <select id="sel-typ"></select></label>
        <div class="sp"></div>
        <div class="unit" role="group" aria-label="열 단위"><button type="button" id="u-year">연도</button><button type="button" id="u-cha">차수</button></div>
      </div>
      <div class="guide" id="guide" hidden></div>
      <div id="note"></div>
      <div class="tbl" id="tbl"></div>
      </div>
    </div>
  </div>
</div>
<p class="foot">도달단계·근거유형: 종합·시행계획 문서 제외, 원문 문장 확인분만 반영. 미표시 단계는 미추진이 아닌 미확인. 근거 자료·연표는 샘플 도메인 D1만 수록. (2025.12 기준 초안)</p>
</div>

명이 지원받았다","지자체 한의 난임진료 지원사업 현황을 실었다."],[3,"지자체 한의약 난임부부 지원사업 대상자 실태조사","2016","B","p.12","한의약난임부부지원사업을시행하는지자체를조사한결과, 최근3 년간지원대상은만38세이하, 만40세이하, 만44세이하로구분할수 있었다. 대상자의수는2014년381명, 2015년457명, 2016년710명으로해 마다증가하는추세이며","지자체 한의약 난임 지원사업이 시행되었음을 대상자 조사로 보여 준다."],[3,"한의약 난임치료의 필요성과 현황, 그리고 폄훼논리의 부당성에 대해 바른 정보를 알려드립니다.","2022","C","p.28","2022년 한의약 난임치료 지원사업 - 서울 25개 자치구 전체, 부산광역시, 대구광역시, 인천광역시, 광주광역시, 대전광역시, 울산광역시, 경기도, 전라남도, 경상북도, 경상남도, 제주특별 자치도 등 광역지자체 및 안양시, 성남시, 수원시, 부천시, 화성시, 청주시, 익산시, 남원시 등 44개 지자제","지자체 난임치료 지원사업 현황을 제시한다. / 재정 지원 수행은 확인되나 가이드라인과 저소득층 지원은 확인되지 않는다."]],"2-1-1-1-3":[[1,"암 치료기술개선을 위한 한의약 인프라구축 및 발전방안 연구","2008","B","p.3","국내 암환자에 대한 한의학 치료기술을 활성화하기 위한 인프라 및 시스템 구축방안을 제시한다.","암 분야 한의약 치료 활성화를 위한 인프라 방안을 계획 전에 제시했다. / 암 임상능력 방안은 맞으나 한약제제 개발·특허·보험 등재는 다루지 않음."],[1,"한방치료기술연구개발사업 중장기 발전계획(2008-2017)","2008","D","p.52","만성․난치성 질환 한약제제 개발 ∙만성․난치성 질환에 한방 단독 혹은 서양의학과의 병용치료로 치료효율을 획기적으로","난치성 질환 한약제제 개발 사업 설계(계획 이전 자료)"],[1,"한의약 R&D 중장기 육성·발전 기획 연구","2008","","p.323","0 종양/당뇨/뇌혈관질환/퇴행성관절질환/고혈압/자가면역질환과 같은 만성 • 난치성 질환에 한경} 단독 혹은 서양의학과의 병용치료로 치료효 율을 획기적으로 높일 수 있는 한방제제의 개발","만성·난치성 질환 한약제제 개발 과제의 목표·지원규모를 설계함 / 2008년, 계획 이전 ②"]],"2-1-1-2-1":[[1,"고령화사회 대비를 위한 한방공공의료역할 증진방안","2005","B","p.105","한방병원의 유휴 급성기 병상을 중풍, 치매 등의 환자를 위한 장기 요양병상으로 전환한다","유휴병상 요양병상 전환 방안(계획 전)"]],"2-1-1-2-2":[[1,"한의약 만성질환 관리제도 도입 방안 연구","2012","AB","p.16","한의원급 만성질환 관리제도의 모형을 개발 - 제도원칙 - 대상 및 등록방식 - 제공 서비스 - 진료 프로토콜 - 지원체계 - 성과지표 및 인센티브","만성질환 관리 매뉴얼과 시범사업 모형을 개발했다. / 문서에 선택의원제라는 말은 없으나 만성질환 관리제도의 서비스·인센티브 모형이 과제 방안과 같다."],[1,"단골 한의사 제도입 방안을 위한 연구","2010","B","p.9","단골한의사제도 도입을 위한 적절한 제도참여 방식. - 단골한의사 자격, 등록 및 전달체계, 제공서비스, 지불보상방식, 재원조 달방법 에 대해 정리함","단골한의사제 도입 방안을 해외 사례와 시범사업 분석으로 제시했다. / '선택의원제'라는 말은 없으나 같은 성격의 단골의사 제도 설계를 다룬다."],[1,"일차의료 전담한의사 제도 연구","2011","BC","p.8","- 한의주치의등록제 시행 만성질환 선택의원에 한의원 포함 - 한의 만성질환 관리 및 표준진료지침 개발(당 뇨, 고혈압, 관절질환)","설문과 국외 사례로 일차의료 전담 한의사 제도를 검토해 선택의원제 유사 방안을 다룬다. / 정부 선택의원제에 대응한 한의계 방안을 제안했다."]],"2-1-4-2-1":[[1,"수요자 중심의 한방공공보건사업의 내실화 방안","2007","BC","p.8","한방건강증진 보건소에 발 및 조사","국민건강증진종합계획에 한의약건강증진 성과관리(통계원·평가체계) 방안 수록(2015 수립). / 계획 시작 전 수립 문서라 ②"],[3,"2017년 통합건강증진사업안내 한의약건강증진","2017","","p.8","보건복지부, 한국건강증진개발원 등 유관 기관이 지원하고 시도 및 시군구가 수행 하며 사회보장정보원과","2017년 한의약 건강증진사업의 추진체계와 행정사항을 안내한 시행 지침이다. / 추진체계와 보건소 성과지표를 담은 사업 안내로 지원체계 운영을 보여 준다."],[3,"2018년 지역사회 통합건강증진사업 안내 (한의약)","2018","","p.85","2018년 지역사회 통합건강증진사업의 핵심성과지표를 공유하되, 시･군･구에서 한의약건강 증진 프로그램의 효과측정에 적합한 지표 개발시 참고","2018년 한의약 건강증진사업의 운영 방법을 정한 시행 지침이다. / 성과지표 운영만 확인되며 중장기 육성방안과 개념 정의 작업은 확인되지 않음."],[3,"2019년 지역사회통합건강증진사업(한의약건강증진분야) 안내","2019","","p.79","사업을 체계적･안정적으로 운영한 우수기관의 성과를 포상하여 지역주민의 건강증진에 기여토록 독려","2019년 한의약 건강증진사업의 운영·성과평가를 정한 시행 지침이다. / 2019년 시행 지침에 성과평가 체계를 정했다. 육성방안과 개념 정의는 확인되지 않았다."],[3,"2020년 지역사회통합건강증진사업 안내(한의약건강증진)","","","p.19","지역보건의료정보시스템(PHIS) 활용 항목을 확대 적용한 성과 평가 체계 도입","2020년 한의약 건강증진사업의 운영·성과평가를 정한 시행 지침이다. / 2019년 추진경과로 적힌 내용이다."],[3,"2016년 지역사회통합 건강증진사업 안내 - 한의약건강증진분야","2016","","p.6","보건복지부, 한국건강증진개발원 등 유관기관이 지원하고 시도 및 시군구가 수행하며","2016년 사업의 목적과 추진체계를 안내했다. / 사업 추진체계 부분만 해당하며 육성방안·성과지표 개발은 보이지 않는다."],[3,"2020 한의약 세계화 추진 해외 전통의학 정책공개 조사","2020","BC","p.38","지역보건의료정보시스팀(PHIS)를활용한한의약건강증진사업성과 관리및평가체계구축('16‾계속)","추진실적표: 사업 정의·성과관리체계 구축 / 추진실적표"],[3,"2015년 지역사회통합 건강증진사업 안내 - 한의약건강증진분야","2015","","p.54","한의약건강증진 분야 성과지표(예시) 02 제3차 국민건강증진종합계획(2011~2020, HP2020)의 주요 지표를 공유 지역에서 운영하는 프로그램에 따라 선택하여 사용","사업안내에 성과지표 예시를 제시함(2015, 계획 전). 목차 쪽 / 2013년 시작한 통합건강증진사업 안에서 성과지표를 써 오는 계속 사업이다(p.10). (계획 전 시행, 계획 기간까지 이어짐)"]],"3-2-2-1-2-2":[[1,"한의약건강증진 프로그램 분석 및 표준매뉴얼 개발","2009","BC","p.8","선정결과 는 다음과 같이 12가지 사업임: 즉, 한의약중풍예방교실; 한의약기공체조 교실; 한의약 장애인 •독거노인 가정방문; 사상체질교실; 한의약육아교실; 한의약금연교실, 한의약산전산후교실; 한의약관절염교실; 한의 약비 만교실; 한의약월경통교실; 한의약갱년기교실 및 한의약아토피교실임.","계획 전에 건강증진 표준 프로그램의 바탕이 되는 표준 매뉴얼을 설계했다. / 계획 전 건강증진 프로그램 12종 선정과 표준 매뉴얼을 설계했다."],[1,"한의약건강증진 프로그램 개발 및 지역사회 연계방안 연구","2014","","p.10","여 한의약 건강증진의 특징을 살릴 수 있는 매뉴얼의 모형을 개발함 영유아기 한의약 건강증진 프로그램 개발 3) 한의약 건강증진 프로그램의 예로서 영유아기 한의약 건강증진 프로그램 매뉴얼을 개발 함","표준 모형과 매뉴얼을 개발하는 계획 전 프로그램 설계 연구다. / 표준 매뉴얼 모형과 프로그램을 설계했다."],[1,"한의약건강증진프로그램 및 지역사회연계방안 연구","2014","","p.10","한의약 건강증진 프로그램의 예로서 영유아기 한의약 건강증진 프로그램 매뉴얼을 개발 함","표준 모형과 매뉴얼을 개발하는 계획 전 프로그램 설계 연구다."],[1,"지역주민 대상 한방건강증진 프로그램 개발","2003","","p.26","본 연구는 이러한 선행 연구를 바당으로 한방건강증진 프로그램의 표 준화된 사업운영지침 및 평가체계 개발에 중점을 두어, 현재 시행되고 있는 한방지역보건사업을 보완 • 강화할 수 있는 구체적인 자료가 될 것 이다.","주민용 건강증진 프로그램 자료를 설계한 계획 전 연구다. / 스캔본이라 쪽 번호 외 글자가 없다."],[1,"2014년 지역사회통합 건강증진사업 안내 - 한의약건강증진분야","2014","","p.9","한의약건강증진프로그램운영 - 지역별특성에따라지역사회관련기관․인력등한의약자원과연계하여대상 자군별한의약건강증진프로그램(기공체조, 한방식이, 한방양생, 사상체질) 제공","프로그램 체계와 운영 매뉴얼이 계획 전 자료다. / 대상자군별 프로그램 체계와 운영 매뉴얼을 담았다."],[1,"학령기 (유치원, 초·중·고) 대상으로 한방건강증진 프로그램 개발","2007","","p.6","이에 대한 학문적인 접근 방안을 마련하기 위하여 필요한 구체적인 사업모형을 제시 하여 학령기의 전강증진에 기여하기 위함","건강증진 프로그램을 계획 전에 개발했다."],[1,"노인대상 한의약 건강증진 프로그램 개발","2015","B","p.22","노인대상 한의약 건강증진 프로그램의 목적은 크게 한의약적 노인 건강관리법의 모색, 프 로그램개발, 시범사업 및 확산전략에 대해 연구하는 것이며,","노인 치매 예방관리 프로그램을 계획 전에 개발했다."],[1,"2015년 지역사회통합 건강증진사업 안내 - 한의약건강증진분야","2015","","p.4","생애주기별 한의약 건강증진프로그램 제공 <예시> (영유아) 한국형 육아교실(모자애착 중시 등) (청소년) 정신건강 및 생리통 관리 등 (임산부) 한국형 임산부 관리(태교, 산후 조리법 등)","프로그램 변경 사항이 계획 전 자료다. / 생애주기별 프로그램 체계로 변경한 내용을 담았다."],[1,"한의 치매환자 건강관리 사업매뉴얼 연구","2020","C","p.16","서울시와 부산시 등에서 진행한 어르신건강증진사업 등의 모델을 기반으로 하고, 본 매뉴얼에서 제시하는 다양한 자료를 활용하게 되면, 향후 보건소 및 지방자치단 체에서 한의사가 중심이 되는 치매사업을 원활하게 실현할 수 있을 것으로 예상됨.","치매 분야 건강증진 프로그램의 표준 설계로 볼 수 있다. / 건강증진사업 모델을 바탕으로 한 치매 사업 매뉴얼이다."],[3,"한의약 건강증진 사업의 변화양상","2017","C","p.13","2015년부터 프로그램별로 3개년에 걸친 개발, 검증, 확산의 3가지 단계에 맞춘 한의약 건강증진 프로그램 표준화작업을 진행하고 있다.","생애주기별 프로그램의 운영 사례를 다뤘다."],[3,"영유아대상 한의약 건강증진 프로그램 개발","2016","B","p.11","어린이 도인체조 분의 동영상을 제작하여 배포하고 매일 회 수행 : 8 1 ◦ 한방배즙간식 배 도라지 더덕으로 만든 음료로 주 회 주간 제공 : , , 2 6","영유아 대상 건강증진 프로그램과 평가도구, 교육자료를 개발했다. / 2016년 어린이집 시범사업으로 프로그램을 실제 적용했다."],[3,"한의약을 활용한 취약아동 건강증진체계 개발 연구","2016","B","p.8","2016년 7월 ~ 10월의 3개월간 매달 한의사주치의가 지역아동센터 방문(총 4회) - 방문시마다 아동 건강검진 및 교육을 시행","지역아동센터 16개소에서 한의 건강관리 시범사업을 수행했다. / 지역아동센터 16개소 대상 시범사업 수행임."],[3,"청소년 대상 한의약 건강증진프로그램 개발 연구","2016","BC","p.77","나 개선점 . 학교 선정 본 시범사업에서는 학교를 개별 섭외함 향후 교육지원청과의 원활한 협조관 : . ○ 계 필요","청소년 프로그램을 개발해 시범사업을 수행했다. / 청소년 프로그램을 개발해 학교에서 시범사업을 실제 수행했다."],[3,"2017년 한의약건강증진사업사례집 '함께하는 한걸음'","2017","C","p.8","인구 노령화(65세 이상 34%)로 인하여 한의약건강증진사업이 어르신대상 사업으로 국한 되어 있음에 따라 생애주기별 한의약건강증진사업의 확산 및 활성화를 위하여 영유아 대상 시범 사업 실시","전국 보건소의 대상별 프로그램 시행 사례를 모았다."],[3,"2017년 통합건강증진사업안내 한의약건강증진","2017","","p.8","임산부 대상 한의약 건강증진프로그램 시범사업(2015년)의 사업내용 추가 ∙각 세부 사업내용 개정 및 보완 ∙생애주기별 표준프로그램 내용 추가 (영유아, 청소년, 취약아동, 노인대상)","보건소에서 시행하는 사업 내용을 담았다."],[3,"장애인 한의약 건강증진 프로그램 개발","2017","B","p.9","2. 시범사업진행 1) 시범사업사전준비 ①문헌조사, 1차매뉴얼개발, 교재·교안초안개발 ②전문가, 기관담당자자문회의및연구진회의를통해매뉴얼및교안초안확정","장애인 건강증진 프로그램을 시범 운영해 표준프로그램을 도출했다."],[3,"2018년 지역사회 통합건강증진사업 안내 (한의약)","2018","","p.8","∙생애주기별 표준프로그램 내용 추가(영유아, 청소년, 취약아동, 노인대상) ∙생애주기별 프로그램의 운영 개요 및 표준프로그램 소개로 내용 재배치","생애주기 프로그램 운영을 안내한다. / 2018년 사업 안내에 표준프로그램을 수록해 보급함."],[3,"2019년 지역사회통합건강증진사업(한의약건강증진분야) 안내","2019","","p.13","3단계의 개발 과정을 통하여 표준프로그램의 운영 매뉴얼, 교육자료, 교육매체, 효과평가 지표, 홍보자료 등을 개발하고 건강증진의 효과성이 입증된 프로그램을 보급함","생애주기 프로그램 운영을 안내한다."],[3,"장애인 대상 한의약 방문건강관리 프로그램 개발","2018","AC","p.13","한의약을활용한장애인방문건강관리프로그램을개발함 - 장애인의건강증진을위한기본건강관리, 근골격계건강관리, 소화기계건강관리, 정신 건강관리프로그램을개발하였으며","장애인 대상 건강관리 프로그램 개발을 수행했다. / 프로그램 개발 연구가 곧 과제 행위로, 2018년에 수행했다."],[3,"2019년 한의약건강증진사업사례집","2019","C","p.10","기존 통합건강증진사업 영양 및 신체활동 프로그램에 비만한의임상지침을 접목한 한의치료(이침 및 한방액기스), 한의사 심층상담 등 복합적인 비만 소아 체중관리 프로그램 운영","보건소가 수행한 대상별 한의약 건강증진 프로그램 사례를 묶었다."],[3,"2020년 지역사회통합건강증진사업 안내(한의약건강증진)","","","p.19","장애인대상 한의약 방문건강관리 표준프로그램 시범운영(한국건강증진개발원)","생애주기 프로그램 운영을 안내한다. / 2019년 추진경과로 적힌 내용이다."],[3,"생애주기별 한의약건강증진 표준프로그램 안내서","2021","","p.8","(3단계) 시범운영 결과를 바탕으로 모형 수정보완을 통한 고도화 및 보급 확산","생애주기별 표준프로그램을 개발해 보건소에 안내했다. / 표준프로그램 개발·보급 경과를 적은 2021년 안내서임."],[3,"2021년 지역사회통합건강증진사업 안내(한의약건강증진)","","","p.20","2019 ⦁장애인대상 한의약 방문건강관리 표준프로그램 시범운영(한국건강증진개발원) ⦁지역보건의료정보시스템(PHIS) 활용 항목을 확대 적용한 성과 평가 체계 도입 2020 ⦁표준프로그램 전 생애주기 모형 완료 및 전국 확산(한국건강증진개발원)","생애주기 프로그램 운영을 안내한다."],[3,"2016년 지역사회통합 건강증진사업 안내 - 한의약건강증진분야","2016","","p.6","생애주기별 대상자를 선정하여 한의약 일반건강관리 프로그램과 질병 예방 및 관리 프로그램 제공","2016년 시행 중인 건강증진 프로그램 사업 내용을 안내했다."],[3,"2020 한의약 세계화 추진 해외 전통의학 정책공개 조사","2020","BC","p.38","생애주기별한의약건강증진표준프로그램전생애주기(8개)모형개발 정상추진 근거마련 연구완료및전국보급확산추진","추진실적표: 생애주기별 표준프로그램 개발·보급 / 추진실적표"],[3,"2024 한의약 육성 지역계획 수립 설명회 발표자료","2024","","p.79","(2단계) 시범사업운영을통한 프로그램현장적용성검증 (3단계) 전국으로확산 (총8종) 임산부, 영유아, 취 약아동, 청소년, 성인, 장애 인, 노인, 장애인방문건강 관리","생애주기별 표준 프로그램 8종을 개발해 시범 적용 후 전국 확산 / 기간 후 자료(2024)이나 개발·보급 사실 확인"],[3,"2013년 지역사회통합 건강증진사업 안내 - 한의약건강증진분야","2013","","p.12","한의약건강증진사업(한의약건강증진 프로그램 운영)은 지역주민의 건강증진 을 위해 보건소 등에서 실시되어","2013 사업안내에 관리군별 프로그램 운영매뉴얼 제시(계획 전) / 보건소에서 관리군별 건강증진 프로그램을 운영해 오는 계속 사업이다. (계획 전 시행, 계획 기간까지 이어짐)"],[4,"한의약을 활용한 취약아동 건강증진체계 개발 연구","2016","B","p.16","시범사업에 대한 경제성 평가는 비용효과분석 및 비용편익분석에서 모두 경제성이 있는 것으로 평가됨.","중재군과 대조군으로 모델의 적용 가능성과 효과를 평가했다. / 시범사업은 2016년 7~10월에 시행되어 계획 기간 안이다."],[4,"장애인 한의약 건강증진 프로그램 개발","2017","B","p.12","◦만족도조사에있어서는전반적만족도가높은편이었으며(평균8.81), 그중부항시술에대한 만족도는9.15점이었고, 사업현장에서도프로그램에대한만족을표현하는경우가많았음.","시범 운영한 프로그램의 효과성을 평가했다."]],"3-2-2-1-2-3":[[3,"2020 한의약 세계화 추진 해외 전통의학 정책공개 조사","2020","BC","p.38","한의약건강증진사업성과대회운영과우수기관표창('14‾계속) 보건소인증및기술지원 정상추진 우수사례발굴과사례집발간을통한지역사회확산독려('14‾계속)","우수기관 표창·사례 확산은 시행됐으나 인증제 도입은 확인되지 않음"]],"3-2-2-1-2-4":[[1,"보건소 한의약건강증진사업 모형 연구 결과보고서","2016","BC","p.6","복합형 A는 도시, 보건소 단위 진료수요도 많으면서 사업수행도 필요한 곳에 각각 사업전 담 공중보건한의사와 진료전담 공중보건한의사 1인씩 배치하여 업무 분담","공중보건한의사 업무 모형과 인력운용 발전 방안을 제시했다."],[1,"보건인력에 대한 한방공공보건사업 인식조사와 한방공공보건 직무교육과정 개발","2006","BC","p.7","건강증진사업에대한개념사업운영및평가능 . , 력을향상시키기위한공중보건한의사교육과정을개발하고자함.","보건소 사업 담당 인력 역량강화 교육과정을 계획 전에 설계했다."],[3,"2020 한의약 세계화 추진 해외 전통의학 정책공개 조사","2020","BC","p.38","온라인신규교육과정(담당자4차시, 대국민7차시) 개발(2018년) 정상추진 사업담당인력확충및 * 공중보건한의사대상사업 운영안내교육 진행(2016‾계속)","추진실적표: 담당 인력 교육 실시 / 추진실적표"]],"4-1-1-1-1-1":[[0,"2019 NIKOM 한의약정책리포트 4권 1호","2019","C","p.24","3) 커뮤니티케어. 일차의료에 한의사의 적극적 참여가 필요하다. 무엇보다 의사와 병원중심 사고의 전환이 필요하 다. 커뮤니티 케어가 성공하기 위해서는 질좋은 보 건의료공급자의 양적 확대가 가장 중요한 요인이","2019년 커뮤니티케어에서 한의약의 역할을 제기했으며 계획 시작 전이다. / 스캔본으로 쪽 번호 외 글자가 없다."],[0,"한의약 통합돌봄사업 성과와 과제 국회토론회 자료집","2021","C","p.6","그러나 국민들에게 더욱 질 높은 서비스를 제공하기 위해서는 짚고 가야 할 문제점도 분명 존재합니다. 특히, 서비스 제공을 위한 표준 매뉴얼을 개발하고 전국적인 한의약","한의약 통합돌봄 선도사업의 성과와 과제를 논의한 토론회다. / 토론회 인사말이며 주제 발표 본문은 글자가 거의 없다."],[0,"한의약정책리포트 8권 1호","2023","C","p.8","제4차 한의약육성발전종합계획의 「한의약 중심 지역 건강 복지 증진」 분야 목표를 달성하기 위해 세부과제인 한의약 건강돌봄 활성화가 필요하다.","태그의 건강돌봄 관련 기고가 지역 건강돌봄의 과제를 제기하는 것으로 보인다."],[0,"2021 NIKOM 한의약정책리포트 6권 1호","2021","BC","p.8","16개 지역사회 통합돌봄 선도사업지에서 한의약 서비스를 제공하는 지역은 13개로 81%를 차지하고 있으며","통합돌봄 선도사업 내 한의 건강돌봄 현황 제시. 수치가 2020년 기준이라 4차 기간의 시행(④) 근거로 쓰지 않음 / 현황 제시 문장이며 2020년 수치다."],[1,"2020년 한의약 건강돌봄 추진 결과보고서","2020","C","p.16","지역별 계획(지역사회보장계획, 통합돌봄 계획 등)에 한의약 건강돌봄 반영 및 연계강화 - 한의약 건강돌봄 지원단 및 지역별 실무협의체 구성・운영","커뮤니티케어 선도지역 시범 결과로 건강돌봄 연계 모형을 제시했다."],[3,"2022년 한의약 건강돌봄 사업 사례집","2022","C","p.9","(결과) ’22년 16개* 지역에서 한의약 건강돌봄 서비스 제공 * 주요 사업 내용은 [붙임1] 지역별 2022년 한의약 건강돌봄 사업 추진 현황 참조","통합돌봄 선도사업 8개 지역의 2022년 한의약 건강돌봄 추진 내용을 담았다. / 통합돌봄 추진 지역에서의 서비스 제공을 확인함."],[3,"2021년 한의약 건강돌봄 사업 사례집","2021","C","p.13","융합형 통합돌봄 대상자에게 통합서비스 제공 - 복합적인 건강욕구를 가지고 있는 대상자에게 한의 방문진료 건강관리 서비스와 복지 서비스 연계 제공","통합돌봄 사업 지역의 2021년 한의약 건강돌봄 추진 내용을 담았다."],[3,"2023년 한의약 건강돌봄 사업 사례집","2023","BC","p.21","보건복지부 노인 의료･돌봄 통합지원 시범 지역 사업 성과 및 추진 의지 사업 운영 결과 - 서비스 제공 및 연계 관련 건수: 965명 1,356건 연계","노인 의료·돌봄 통합지원 시범지역의 2023년 추진 내용을 담았다."],[3,"2021년 지역사회통합건강증진사업 안내(한의약건강증진)","","","p.17","제4차 한의약육성발전종합계획(2021~2025) - 1분과 : 한의약 중심 지역 건강 복지 증진 : 한의약 건강돌봄 활성화 ※ 현재 일부 지역에서 시범 운영 중인 한의약 건강돌봄","건강돌봄 운영 안내가 일부 포함된 것으로 보인다. / 일부 지역 시범 운영 수준이며 지자체 통합돌봄계획 반영은 확인되지 않았다."],[3,"한의약정책리포트 9권 1호","2024","C","p.17","한의약 건강돌봄 표준매뉴얼 개발 시 질환별 한의표준임상진료지침 내용이 함께 활용되어 제작되었으며 이에 기반하여 한의약 돌봄사업이 시행되고 있다.","제4차 종합계획 주요 사업 추진 실적에 건강돌봄이 포함된 것으로 태그에 나타난다. / 한의약 돌봄사업 시행을 적었다. 지자체 계획 반영까지 보여 주지는 않는다."],[3,"한의약 동향브리프 - 국내동향(2023년 제1호)","2023","","p.6","최우수 부산광역시 부산진구청 보건특화형 한의 방문진료사업 수행 전주시청 전주형 통합돌봄 사업 추진","2022년 지자체 한의약 건강돌봄 사업 수행·통합돌봄 연계 사례 / 근거는 p.6"],[3,"한국한의약진흥원 정책본부 2021년 고유사업 및 한의약 육성사업 실적보고서","2021","","p.43","지자체 및 정부 통합돌봄사업 추진지역 대상 모니터링 실시 * 복지부 지역사회 통합돌봄 사업, 행안부 주민자치형 공공서비스 구축사업 등 ○ 지역 건강돌봄 지원을 위한 전문 컨설턴트 구성 및지역 간담회실시","2021년 추진실적으로 통합돌봄 지역 모니터링·컨설팅·간담회 수행"],[3,"2021 NIKOM 한의약정책리포트 6권 2호","2021","C","p.7","지자체에서 수행하는 통합돌봄 사업 내에서 한의약 건강 돌봄 서비스 제공을 수월하게 연계시킬 수 있도록 보건복지부에서 제작한 통합돌봄 실무협의체 가이드의 양식을 토대로","2021년 한의약 건강돌봄 현황과 통합돌봄의 과제를 다뤘다. / [J38] 원래 ① 불인정 줄의 메모에 적힌 맞는 단계로 인정. 문제 제기를 넘어 실무 가이드 제작과 지역간담회를 실제로 수행한 내용이다. 맞는 단계: ④"],[4,"한의약 건강돌봄 서비스 인식도 및 만족도 조사연구 최종보고서","2021","BC","p.55","방문진료에 대해서는 모든 인터뷰 참여자가 높은 만족도를 보임. 인터뷰 참여자들은 병원에 방문했을 때보다 한의사가 가정을 방문했을 때 자신의 건강 문제를 더욱 자 세히 알릴 수 있었다고 보고하였으며","사업 수요자·공급자의 만족도로 건강돌봄 시행 결과를 평가했다. / 서비스 대상자 인터뷰의 만족도 분석이다."],[4,"2022 NIKOM 한의약정책리포트 7권 1호","2022","C","p.6","부천과 김포의 커뮤니티케어 대상자를 그룹 인터뷰하였으며 대구한의대학교에서 진행되었다. 인터뷰에 응한 대상자 대부분이 한의사의 방문진료에 만족하였고","부천시 한의약 건강돌봄 연계사업의 성과를 다뤘다. / 시행 후 대상자 만족도를 평가했다."],[4,"2023년 한의약 건강돌봄 사업 사례집","2023","BC","p.19","만족도 조사를 진행하였으며 전반적인 만족도는 4점대로 높았음 ∙ 특히 타인 추천 의향과 재참여 의향이 매우 높게 나타남","지역별 만족도와 목표 달성도를 정리했다."]],"4-1-1-1-1-2":[[0,"2021 NIKOM 한의약정책리포트 6권 1호","2021","BC","p.8","주민자치형 공공서비스 사업지 중 김포, 홍천, 성북 3곳에서 한의약 서비스가 제공되고 있다.","주민자치형 공공서비스 내 제공 현황 제시. 수치가 2020년 기준이라 ④로 쓰지 않음 / 현황 제시 문장이며 2020년 수치다."],[1,"2020년 한의약 건강돌봄 추진 결과보고서","2020","C","p.16","지역사회 통합돌봄 사업, 주민자치형 공공서비스 사업 등과 한의약 건강돌봄 연계강화 - 서비스 대상자별 한의약서비스 제공 및 복지서비스 연계강화","주민자치형 3개 지역 시범 결과를 분석해 정책을 제언했다."],[1,"한의약 통합돌봄사업 성과와 과제 국회토론회 자료집","2021","C","p.59","주민자치형 공공서비스 구축사업 지역 중 한의약 서비스 제공지역* * 경기도 김포시, 강원도 홍청군, 서울시 성북구(’20년 기준)","주민자치형 사업 내 한의약 제공 지역과 연계강화 방향을 제시함 / 2020년 기준 내용이라 ①② 한정"],[3,"2022년 한의약 건강돌봄 사업 사례집","2022","C","p.9","행정안전부 주민자치형 공공서비스 구축사업 ’21 : 29 ’22 : 19 1 (3.4%) 0 (0.0%)","행안부 노인돌봄 시범사업 지역인 화성의 추진 내용을 담았다. / 주민자치형 사업 내 제공은 2021년 1개 지역이고 2022년은 0개이며, 제안의 화성은 행안부 다른 사업인 노인돌봄 시범사업임."]],"4-1-1-1-1-3":[[0,"2020년 한의약 건강돌봄 추진 결과보고서","2020","C","p.147","지역별 한의약 건강돌봄 연계사례 발굴 및 확산 추진 필요 ❍ 연간조사, 지역 협의체 운영을 통한 연계사례 발굴 등을 통해 한의약 서비스 대상자 중심의 복지서비스 연계사례 발굴 필요","연계사례 발굴·확산 필요성을 제기함"],[3,"2022년 한의약 건강돌봄 사업 사례집","2022","C","p.3","본 사례집은 2022년 한의약 건강돌봄 사업 우수사례 공모에 참여한 9개 지자체의 사업 추진 결과보고서를 기반으로 제작되었습니다.","2022년 우수사례 공모 지역의 사례를 사례집으로 모아 확산한 실적이다. / 공모 사례를 사례집으로 제작·확산함."],[3,"2021년 한의약 건강돌봄 사업 사례집","2021","C","p.12","1. 경기도 부천시(2021년 우수 사례 지역) 기본사항","2021년 사업 지역의 사례를 사례집으로 모아 확산한 실적이다. / 2021년 사업 지역의 우수 사례를 모은 사례집이다."],[3,"한의약 동향 브리프(2021년 12월호)","2021","","p.7","한국한의약진흥원은 한국건강증진개발원과 공동으로 12월 14일 ‘2021년 한의약 건강돌봄사업 및 한의약 건강증진사업 성과대회’ 개최","2021년 한의약 건강돌봄·건강증진사업 성과대회를 다뤘다."],[3,"한의약 동향브리프 - 국내동향(2023년 제1호)","2023","","p.6","보건복지부와 한국한의약진흥원은 2022년 12월 22일 ‘2022년 한의약 건강돌봄 사업 성과 대회’를 개최하여 한의약 건강돌봄 사업 우수지역 발굴·포상하고, 우수사례 공유 및 확산","2022년 지역사회 한의약 건강돌봄 사업 우수사례를 다뤘다."],[3,"2023년 한의약 건강돌봄 사업 사례집","2023","BC","p.7","한의약 건강돌봄 우수사례 발굴 및 성과대회 실시(’21, ’22, ’24. 6(’23년 사례)시행)","2023년 사업 성과대회 공모 16개 시·군·구의 사례를 사례집으로 모아 확산했다."],[3,"한국한의약진흥원 정책본부 2021년 고유사업 및 한의약 육성사업 실적보고서","2021","","p.45","한의약 건강돌봄 우수사례선정및성과대회개최 - 우수사례 공모 및 선정 · (심사일정) 2021.11.16.","우수사례 선정과 성과대회 개최 실적"]],"4-1-1-1-2-1":[[3,"2021년 지역사회통합건강증진사업 안내(한의약건강증진)","","","p.1","본 사업 지침은 지역사회 통합건강증진사업의 ｢한의약건강증진｣ 분야 운영에 대한 세부적인 안내서이며,","2021년 사업 운영을 정한 표준 업무지침이다. / 사업 안내서 자체가 표준 업무지침의 배포에 해당한다. 전담인력 간 연계 강화는 별도로 확인되지 않았다."],[3,"2023 NIKOM 한의약정책리포트 8권 1호","2023","C","p.7","사업 전담인력을 대상으로 생애주기별 한의약 건강증진 표준프로그램을 활용하여 보건소 내 타 사업과 연계한 민간 협력체 운영의 활성화를 추진하고 있다.","2022년 9개 보건소 기술지원 등 연계 강화 추진(표준 업무지침은 미확인)"],[3,"한의약정책리포트 8권 1호","2023","C","p.7","사업 전담인력을 대상으로 생애주기별 한의약 건강증진 표준프로그램을 활용하여 보건소 내 타 사업과 연계한 민간 협력체 운영의 활성화를 추진하고 있다.","보건소 내 타 사업 연계 활성화를 추진 중임"],[3,"2024 한의약 육성 지역계획 수립 설명회 발표자료","2024","","p.78","1. 생애주기별한의약건강증진표준프로그램기술지원을통한보건소내사업간연계와민간협력체운영의활성화 - 총8종의표준프로그램개발· 보급","보건소 내 사업 간 연계 활성화 실적. 표준업무지침 배포는 미확인 / 추진실적 표"]],"4-1-1-1-2-2":[[1,"2020년 지역사회통합건강증진사업 안내(한의약건강증진)","","","p.70","한의약 건강증진 사업성과평가 평가 항목：우수기관, 우수사례, 표준프로그램 활용 우수사례 평가 대상：2020.1.1.~2020.12.31. 운영 기관 및 운영 프로그램","우수기관·우수사례 평가 계획(2020 안내, 평가는 2021 예정) / 자료목록 연도 없음, 제목상 2020"],[3,"생애주기별 한의약건강증진 표준프로그램 안내서","2021","","p.8","(1단계) 현장수용성이 입증된 지역 우수사례를 기반으로 생애주기별 핵심 주제를 선정하여 현장 프로토콜 기반의 모형 초안을 개발","표준 사업모형의 보급 자료다. / 우수사례 기반 모형 개발·보급은 확인되나 우수기관 포상은 확인되지 않음."],[3,"2023 NIKOM 한의약정책리포트 8권 1호","2023","C","p.8","성과대회 개최를 통하여 유공자 및 우수기관·사례에 대한 표창 수여 및 지역의 우수사례를 공유","건강증진사업 우수기관·사례 선정과 표창이 시 5","‘21년  개발한  노인  대상  한의약  건강돌봄  표준  매뉴얼  및  교육자료  활용방법에  대한  지역  한의사회  대상  교육  실시","2022년 사업 참여 15개 지역 한의사를 교육했다."]],"4-1-1-2-2-2":[[1,"2024 NIKOM 한의약정책리포트 9권 1호","2024","C","p.11","진흥원과 동신대학교는 2023년 11월 한의약 건강돌봄 전문인력 양성 교육프로그램 연구를 진행하였으며 본 원고를 통해 연구 결과를 소개하고자 한다.","2024년 건강돌봄 전문인력 양성을 제언했다."],[3,"2023년 한의약 건강돌봄 사업 사례집","2023","BC","p.12","한의약 건강돌봄 전문인력 양성 교육프로그램 운영 - 지자체 담당자, 한의사, 돌봄 제공인력 등 한의약 건강돌봄 전문인력 대상별 맞춤형 교육 프로그램 개발 및 실시","전문인력 교육프로그램 개발·실시"],[3,"한의약정책리포트 9권 1호","2024","C","p.13","최종적으로 교육 프로그램은 6개의 강의 동영상으로 제작되었으며 이는 대한한의사협회 보수교육, 돌봄 관련 협회 및 학회 등을 통해 홍보되고 배포될 예정이다.","한의약 건강돌봄 관계자 대상 교육 프로그램이 실제 개발(제작)됨, 운영은 배포 예정 / 2023 동신대 개발 연구 기반. 개발은 완료, 운영은 예정"]],"4-1-1-2-2-3":[[3,"2024 한의약 육성 지역계획 수립 설명회 발표자료","2024","","p.4","제4차 한의약 육성발전 종합계획 및 한의약 육성 지역계획 정책 방향 및 추진 방향을 안내하여 계획 수립의 내실화 도모 * 한의약육성법 제8조에 근거, 한의약 육성 지역계획을 수립 의무화 일시 및 장소 _ (1차) 서울 3.28(목) 코리아나호텔 7층 참석대상 _ 한의약육성 지역계획 시·도 및 시·군·구 담당자 등","시·도와 시·군·구 담당자를 대상으로 한 설명회로 지자체 담당인력 교육에 해당할 수 있다. / 시·군·구 담당자 설명회이며 읍·면·동 담당자 교육은 확인되지 않는다."],[3,"한국한의약진흥원 정책본부 2021년 고유사업 및 한의약 육성사업 실적보고서","2021","","p.48","(지역 간담회) 7개지역 대상 간담회실시 (기간) 2021.08. ‾ 2021.11.","지자체 담당자 대상 지역 간담회 실시"],[3,"2022년 한의약 건강돌봄 사업 사례집","2022","C","p.10","●(미추진 지역 대상) 한의약 건강돌봄 사업 소개 및 우수지역 사례 소개, 한국한의약진흥원의 사업 추진 지역 지원 방향 안내","지자체 담당자 대상 간담회·설명회를 실시함(52명)"]],"4-1-1-2-3-1":[[0,"2021년 한의약 건강돌봄 사업 사례집","2021","C","p.164","○한의약 건강돌봄 서비스 제공 모니터링 및 분석 - 전국적인 한의약 서비스 제공 및 복지서비스 연계현황 모니터링 - 지역별, 사업별 건강돌봄 서비스 특성 분석","사례지역 개선방향으로 제공·연계현황 모니터링 필요를 제기함"],[1,"2020년 한의약 건강돌봄 추진 결과보고서","2020","C","p.12","한국한의약진흥원, 대한한의사협회 ❍지역별 한의약 건강돌봄 서비스 모니터링, 제공지원 및 사례분석","지역별 건강돌봄 모니터링 추진체계를 설계함 / 2020년 모니터링 수행은 계획 이전이라 ②로 둠"],[3,"한의약 건강돌봄 서비스 인식도 및 만족도 조사연구 최종보고서","2021","BC","p.42","인지여부: 노인 응답자 223명 중 110명(4996)는 지역사회 한의약 건강돌봄을 '들어본 적이 없다'고 응답하였으며, 95명(4396)는 '들어본 적은 있더라도 잘 모른다', 18명 (8%)는 '잘 알고 있다고 응답함","2021년 수요자·공급자 인식도와 만족도 조사를 수행했다. / 스캔본으로 쪽 표시만 있고 본문 글자가 없다."],[3,"한국한의약진흥원 정책본부 2021년 고유사업 및 한의약 육성사업 실적보고서","2021","","p.44","지자체 및정부통합돌봄사업지역대상건강돌봄 모니터링실시 ○한의약 서비스 제공  건강증진을 위한 공공의료 체계 내 수직적, 수평적 체계의 구심점 역할","고령화 대비 건강관리 방향을 계획 전에 제시했다. / 고령화 대비 평생건강관리체계에서 공공 한방의료의 역할을 설계한 것으로 일차의료 모형과는 일부만 겹친다."],[1,"단골 한의사 제도입 방안을 위한 연구","2010","B","p.10","퇴행성 관절진환과 노인 주치의, 소아주치의 제도 도입을 위한 한의약적 관리내용 을 제안함.","일차의료 중심 관리 모형의 초기 설계로 볼 수 있다."],[1,"한의 만성질환 모형연구","2020","A","p.13","지역한의사회에 등록된 한의원을 중심으로 한의 중재를 통한 치료적 접근방식을 추진하고, 건강관리, 환자관리 모니터링 및 개별 맞춤형 상담⋅교육 통한 생활 개선을 목표로 하는 관리적 접근방식 추진함.","한의 만성질환 관리 모형과 매뉴얼을 개발했다. / 일차의료 모형이지만 노인 대상이 아니라 고혈압·당뇨병 환자 대상이다."],[1,"한의노인주치의 사업매뉴얼 연구","2020","C","p.10","노인 근골격계질환(낙상 중심) 예방 및 관리 모형 －균형, 보행 등의 평가도구를 통해 예방군과 치료군으로 분류함","노인 대상 한의 일상건강·근골격계 관리 사업 모형을 제시했다."]],"4-1-2-1-2-1":[[1,"한의약 방문 건강돌봄 서비스 도입방안 연구 최종보고서","","B","HWP","표준 차트 사용 필요성 및 작성 방법, 환자 방문시 응대 방법(한의 서비스 제공 방법), 행정처리 절차, 응급(위기) 상황 발생시 대응 방법 등","방문진료 표준 서식 6종과 작성 가이드를 설계했다. / 부록의 서식 작성 가이드와 함께 방문진료 지침의 틀을 제시한다."],[1,"한의방문진료매뉴얼 최종보고서","","","p.31","표준화된 한의 방문진료 매뉴얼을 개발하고 보급하여 한의약 건강증진 사업 역량 강 화 및 사업수행 인력의 수행능력 제고 ○한의 방문진료 사업 확산을 위한 전략 수립이 필요함에 따라 사업 착수가 용이하도록 단계별 가이드 제시","국내외 제도를 검토해 방문진료 사업·진료·교육 매뉴얼을 제시했다. / 방문진료 매뉴얼과 단계별 가이드를 설계했다."]],"4-1-2-1-2-2":[[0,"농촌지역 방문 진료 실태와 개선 과제","2022","BC","p.6","‘일차 의료 방문 진료 수가 시범사업’에 참여한 농촌지역 의료기관의 수는 의과 76개소, 한의과 199개소 정도로 매우 적다.","농촌 미충족 의료와 방문 진료 수요를 분석해 방문진료 활성화의 문제와 수요를 제기한다. / 농촌 방문 진료의 문제를 제기함."],[1,"한의약 방문 건강돌봄 서비스 도입방안 연구 최종보고서","","B","HWP","지자체, 지역한의사회, 기타 기관(의료사협, 복지단체 등)과 지역맞춤형 사업 기획, 계획서 작성 등 협조 사업 진행 ․ 교육 및 기술지원 : 표준진료 차트 작성, 한의서비스 제공 방법, 행정처리 절차 등","방문 건강돌봄 서비스의 도입방안을 제시했다."],[1,"2022 NIKOM 한의약정책리포트 7권 2호","2022","BC","p.8","대상자 평가 및 계획수립, 한의사 방문주기, 서비스 내용, 사례회의 등에 대해 표준화한 프로토콜 개발이 필요하다.","2022년 통합돌봄 방문진료를 제언했다."],[1,"장애인 대상 한의약 방문건강관리 프로그램 개발","2018","AC","p.8","대상자파악→본프로그램대상자선정→사전평가→주건강문제(일반, 근골격계, 소화기계, 정신건강등) 파악→관리계획마련→건강관리프로그램제공및타사업연계 →평가및추후관리","한의약 방문 서비스 모형과 확산 전략을 설계했다. / 장애인 대상 한의약 방문 서비스 제공 흐름을 설계했다."],[1,"한의 지역사회 사업 수가모형 구축 연구","2021","B","p.7","방문진료 모형은 한의사 방문시 제공할 수 있는 서비스를 중심으로 수가를 도출하고 이와 같이 모형과 수가를 바탕으로 한의의 지역사회 보건의료 참여도를 높이는 방안 모색과 앞으로의 방향성에 대해 제언하고자 한다.","한의 방문진료 등 지역사회 사업의 수가모형을 구축했다."],[1,"2020년 한의약 건강돌봄 추진 결과보고서","2020","C","p.141","□ 한의약 방문진료 서비스 제공 모형 ❍ 한의약 방문진료 사업 프로세스 - 사업계획수립부터 환자 등록, 케어플랜 수립 및 환자 관리, 사업 평가 및 결과보고서 작성·제출까지의 전단계로 이루어짐","방문진료 모형을 제시했다."],[1,"한의방문진료매뉴얼 최종보고서","","","p.82","사업 모형은 한의 서비스 제공 흐름을 알 수 있도록 등록부터 점검 및 평가의 항목으 로 이루어짐 [그림 3-3] 한의 서비스 모형 －환자 등록, 케어플랜 수립, 환자 관리(중재), 점검 및 평가 순의 흐름에 따라 서비스 가","방문진료 서비스 제공 체계의 설계와 관련된다. / 방문진료 서비스 제공 모형을 제시했다."],[1,"노인 대상 한의약 건강돌봄 표준매뉴얼 개발 연구","2021","","p.30","한의약 방문진료 서비스 제공의 주요 목적은 현재 경험하고 있는 증상의 완화 및 치료 이므로 복지서비스 자원의 연계를 위한 기초 평가항목은 핵심적인 내용을 중심으로 최 대한 간략하게 구성","표준매뉴얼에서 방문진료 단계별 서비스 제공 과정을 설계함"],[2,"인천광역시 한의약 육성 및 지원에 관한 조례","2023","E","p.1","“한의 경로당 주치의”란 인천광역시 관내 경로당을 방문하여 시에 주소를 둔 노인을 대상으로 최소한의 진료와 건강 상담, 보건 교육을 포함한 한약ㆍ침구치료 등의 한의약 보건의료행위를 지속적으로 하는 보건의료인을 말한다.","경로당을 찾아 진료하는 한의 경로당 주치의 사업을 규정함. / 제9조에 사업 시행과 비용 보조 근거가 있어 방문 진료·교육·상담을 규정한다."],[3,"한의약 동향 브리프(2021년 9월호)","2021","","p.6","보건복지부는 전국 1,348개 한의원을 선정하여 8월 30일부터 「일차의료 한의 방문 진료 수가 시범사업」 시행을 통해 거동이 불편한 재가 환자의 한방의료서비스 제공","1,348개 한의원이 참여하는 방문진료 시행을 다뤘다. / 방문진료 시행은 확인되나 서비스 제공 모형 개발은 이 문장으로 확인되지 않음."],[3,"2022년 한의약 건강돌봄 사업 사례집","2022","C","p.229","사 업 명: 일차의료 한의 방문진료 수가 시범사업 사업기간: ’22.1. ~ 지속 사업대상: 한의 방문진료가 필요한 노인돌봄 대상자 참여기관: 화성시한의사회(한의원 14개소)","화성시에서 한의 방문진료 수가 시범사업을 시행함"]]},"TH":[["th1","보건소·건강증진","보건소를 거점으로 한 한의약 공공보건·건강증진 사업",["1-1-2-1","2-1-4-2-1","2-1-4-2-2","2-1-4-2-3","3-2-2-1-2-1","3-2-2-1-2-2","3-2-2-1-2-3","3-2-2-1-2-4","4-1-1-1-2-1","4-1-1-1-2-2"]],["th2","난임 지원","한의약 난임치료의 표준화와 재정 지원",["2-1-1-1-1","2-1-1-1-2"]],["th3","건강돌봄","지역사회 통합돌봄 안에서의 한의약 건강돌봄 제공",["4-1-1-1-1-1","4-1-1-1-1-2","4-1-1-1-1-3","4-1-1-1-3-1","4-1-1-1-3-2","4-1-1-1-3-3","4-1-1-2-1-1","4-1-1-2-1-2","4-1-1-2-1-3","4-1-1-2-2-1","4-1-1-2-2-2","4-1-1-2-2-3","4-1-1-2-3-1","4-1-1-2-3-2"]],["th4","일차의료·방문진료","한의약 일차의료 모형, 주치의, 방문진료",["2-1-1-2-1","2-1-1-2-2","4-1-2-1-1-1","4-1-2-1-1-2","4-1-2-1-1-3","4-1-2-1-2-1","4-1-2-1-2-2"]],["th5","중증질환 임상역량","암·뇌혈관 질환 등에 대한 한의약 임상능력",["2-1-1-1-3"]]]};
const DOMN={D1:'일차의료·돌봄·한의사 역할',D2:'공공·협진·보장성',D3:'한약',D4:'인프라',D5:'산업·글로벌'};
const DOMS=['D1','D2','D3','D4','D5'];
const STG=['의제설정','정책기획','정책결정','정책집행','정책평가'];
const STGD=['해결해야 할 문제와 정책개입 필요성이 제시되었는가','무엇을 어떻게 할 것인지 구체적인 방안이 마련되었는가','해당 방안을 시행하기로 공식 승인·확정했는가','사업·제도·서비스가 실제로 시행되었는가','추진실적이나 성과를 기준과 비교하여 평가했는가'];
const NUM=['①','②','③','④','⑤'];
const TYP=['A','B','C','D','E'];
const TYPN={A:'맥락독립적 과학적 근거',B:'맥락민감적 과학적 근거',C:'현지근거',D:'전통지식 기반 정책·규제 근거',E:'제도근거'};
const PLAN5={D1:12,D2:20,D3:18,D4:37,D5:44};
const PER=[['계획 이전',2001,2005],['제1차',2006,2010],['제2차',2011,2015],['제3차',2016,2020],['제4차',2021,2025]];
const YRS=[];for(let y=2001;y<=2025;y++)YRS.push(y);
const H={cha:null,dom:null,stg:null};
const S={view:'home',cha:'all',dom:'D1',stg:'all',typ:'all',q:'',unit:'year',pop:null};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ev=id=>(DB.E[id]||[]).filter(e=>S.typ==='all'||e[3].includes(S.typ));
const byId=(a,b)=>a[1]-b[1]||a[0].localeCompare(b[0],undefined,{numeric:true});
const perIdx=y=>y<2006?0:Math.min(4,Math.floor((y-2006)/5)+1);
const stMarks=t=>STG.map((s,i)=>t[4][i]==='1'?NUM[i]:'').join('');
function tasks(){
  const q=S.q.trim();
  return DB.T.filter(t=>t[2]===S.dom&&(S.cha==='all'||t[1]===S.cha)&&(S.stg==='all'||t[4][+S.stg]==='1')
    &&(!q||t[3].includes(q)||t[0].includes(q))&&(S.typ==='all'||t[5][TYP.indexOf(S.typ)]>0)).sort(byId);
}
const domCount=d=>S.cha==='5'?PLAN5[d]:DB.T.filter(t=>t[2]===d&&(S.cha==='all'||t[1]===S.cha)).length;
const ncol=()=>S.unit==='year'?25:5;
const colOf=y=>S.unit==='year'?y-2001:perIdx(y);
const span=(a,b)=>S.unit==='year'?(a===b?String(YRS[a]):YRS[a]+'–'+YRS[b]):(a===b?PER[a][0]:PER[a][0]+'–'+PER[b][0]);

function segments(id){
  const n=ncol(),by=Array.from({length:n},()=>[]);
  ev(id).forEach(e=>{if(!e[2])return;const k=colOf(+e[2]);if(k>=0&&k<n)by[k].push(e);});
  const out=[];let cur=null;
  by.forEach((l,i)=>{if(l.length){if(cur&&cur.b===i-1){cur.b=i;cur.list.push(...l);}else{cur={a:i,b:i,list:[...l]};out.push(cur);}}});
  return out;
}

  $('sel-dom').innerHTML=DOMS.map(d=>`<option value="${d}"${S.dom===d?' selected':''}>${d} ${DOMN[d]}</option>`).join('');

  $('sel-stg').innerHTML=`<option value="all">전체</option>`+STG.map((s,i)=>`<option value="${i}"${S.stg===String(i)?' selected':''}>${NUM[i]} ${s}</option>`).join('');
  $('sel-typ').innerHTML=`<option value="all">전체</option>`+TYP.map(c=>`<option value="${c}"${S.typ===c?' selected':''}>${c} ${TYPN[c]}</option>`).join('');

function renderSum(ts){
  const col=['var(--m1)','var(--m2)','var(--m3)','var(--m4)','var(--m5)'];
  if(S.cha==='5'){$('sum').innerHTML=`<h2>과제 ${PLAN5[S.dom]}개 <span>· 제5차 종합계획 · 판정 준비 중</span></h2>`;return;}
  const sc=STG.map((s,i)=>ts.filter(t=>t[4][i]==='1').length),tot=sc.reduce((a,b)=>a+b,0)||1;
  $('sum').innerHTML=`<h2>과제 ${ts.length}개 <span>· 2025.12 기준</span></h2>`+
    `<div class="sbar">${sc.map((k,i)=>k?`<i style="flex:${k/tot};background:${col[i]}"></i>`:'').join('')}</div>`+
    `<div class="nums">${sc.map((k,i)=>`<div><b>${k}</b><span>${NUM[i]} ${STG[i]}</span></div>`).join('')}</div>`+
    (()=>{const tc=TYP.map((c,i)=>ts.filter(t=>t[5][i]>0).length);return `<div class="tyl">근거유형 &nbsp;${TYP.map((c,i)=>c+' '+tc[i]).join(' · ')}</div>`;})();
}
function barHtml(id,s,n,N){
  const st=[...new Set(s.list.map(e=>e[0]))].sort(),top=st[st.length-1];
  const on=S.pop&&S.pop.id===id&&S.pop.a===s.a;
  const unk=s.a<0,w=unk?1:s.b-s.a+1,narrow=w<2;
  const tip=`${unk?'연도 미상':span(s.a,s.b)} · ${st.map(i=>NUM[i]+' '+STG[i]).join(', ')} · 근거 ${s.list.length}건`;
  const pos=unk?`left:calc(${n} * 100% / ${N} + 2px);width:calc(100% / ${N} - 4px)`:`left:calc(${s.a} * 100% / ${N} + 2px);width:calc(${w} * 100% / ${N} - 4px)`;
  const inner=unk?'':narrow?`<span class="ch">${NUM[top]}</span>`
    :`<span class="t">${st.map(i=>STG[i]).join('·')}</span>`;
  return `<button type="button" class="bar${unk?' u':''}${on?' on':''}" style="${pos}${unk?'':`;background:${STC[top]};box-shadow:none;color:#fff`}" data-id="${id}" data-a="${s.a}" title="${esc(tip)}" aria-label="${esc(tip)}">${inner}</button>`;
}
function timeline(ts){
  const n=ncol(),N=n+1,cw=S.unit==='year'?'72px':'150px';
  const cols=S.unit==='year'?YRS.map((y,i)=>[String(y),i]):PER.map((p,i)=>[p[0],i]);
  const free=cols.map(([l,i])=>ts.filter(t=>!ev(t[0]).some(e=>e[2]&&colOf(+e[2])===i)).length);
  const lines=`${'<i></i>'.repeat(N)}`;
  let h=`<div class="tg" style="--n:${N};--cw:${cw}"><div class="r hd"><div class="c0">과제<small>도달단계 · 근거유형</small></div><div class="tk">${cols.map(([l],i)=>`<div><b>${l}</b></div>`).join('')}<div><b>연도 미상</b></div></div></div>`;
  ['1','2','3','4'].forEach(c=>{
    const g=ts.filter(t=>t[1]===c);if(!g.length)return;
    h+=`<div class="r grp"><div class="c0">제${c}차 종합계획 <span>· 과제 ${g.length}</span></div></div>`;
    g.forEach(t=>{const u=ev(t[0]).filter(e=>!e[2]);
      h+=`<div class="r row"><div class="c0"><span class="nm" title="${esc(t[3])}">${esc(t[3])}</span><span class="cells" title="도달단계">${NUM.map((n,i)=>`<b class="${t[4][i]==='1'?'y':''}" style="${t[4][i]==='1'?`background:${STC[i]};border-color:${STC[i]}`:''}" title="${NUM[i]} ${STG[i]}${t[4][i]==='1'?'':' (미확인)'}">${i+1}</b>`).join('')}</span><i class="vl"></i><span class="cells ty" title="근거유형">${TYP.map((c,i)=>`<b class="${t[5][i]>0?'y':''}" title="${c} ${TYPN[c]} ${t[5][i]}건">${c}</b>`).join('')}</span></div><div class="tk">${lines}${segments(t[0]).map(s=>barHtml(t[0],s,n,N)).join('')}${u.length?barHtml(t[0],{a:-1,b:-1,list:u},n,N):''}</div></div>`;});
  });
  if(!ts.length)h+='<div class="empty">해당 과제 없음</div>';
  return h+'</div>';
}
function list(ts){
  let h=`<table class="lt"><thead><tr><th>과제</th><th>과제 ID</th><th>차수</th>${STG.map((s,i)=>`<th class="c">${NUM[i]}</th>`).join('')}${TYP.map(c=>`<th class="c">${c}</th>`).join('')}</tr></thead><tbody>`;
  h+=ts.map(t=>`<tr><td><div class="nm" title="${esc(t[3])}">${esc(t[3])}</div></td><td>${t[0]}</td><td>제${t[1]}차</td>${STG.map((s,i)=>`<td class="c">${t[4][i]==='1'?'<span class="y">●</span>':'<span class="no">○</span>'}</td>`).join('')}${t[5].map(k=>`<td class="c">${k||'<span class="no">–</span>'}</td>`).join('')}</tr>`).join('');
  if(!ts.length)h+='<tr><td colspan="13" class="empty">해당 과제 없음</td></tr>';
  return h+'</tbody></table>';
}
function popHtml(id,a){
  const t=DB.T.find(x=>x[0]===id);if(!t)return '';
  let s,lab;
  if(a<0){s={list:ev(id).filter(e=>!e[2])};lab='연도 미상';}
  else{s=segments(id).find(x=>x.a===a);if(!s)return '';lab=span(s.a,s.b);}
  const es=s.list.slice().sort((x,y)=>(x[2]||'9999').localeCompare(y[2]||'9999')||x[0]-y[0]);
  const st=[...new Set(es.map(e=>e[0]))].sort(),ty=TYP.filter(c=>es.some(e=>e[3].includes(c)));
  return `<button type="button" class="x" id="pop-x" aria-label="닫기">×</button><div class="h"><span class="ch">${NUM[st[st.length-1]]}</span>${esc(t[3])}</div>`+
    `<div class="meta">${lab} · ${t[0]} · 제${t[1]}차 · 근거 ${es.length}건</div>`+
    `<div class="k">확인된 단계 ${st.map(i=>NUM[i]+' '+STG[i]).join(', ')}<br>근거유형 ${ty.join('·')||'없음'}</div>`+
    `<ul>${es.slice(0,5).map(e=>`<li><b>${e[2]?esc(e[2]):'연도 미상'} · ${esc(e[1])}</b>${e[5]?`<p>${esc(e[5])}</p>`:''}<small>${NUM[e[0]]} ${STG[e[0]]}${e[4]?' · '+esc(e[4]):''}</small></li>`).join('')}</ul>`+
    (es.length>5?`<div class="more">외 ${es.length-5}건</div>`:'');
}
function closePop(){if(S.pop){S.pop=null;$('pop').hidden=true;document.querySelectorAll('.bar.on').forEach(b=>b.classList.remove('on'));}}
const STC=['var(--m1)','var(--m2)','var(--m3)','var(--m4)','var(--m5)'],TYC=['#4b5159','#6f757e','#9aa1ab','#bfc4cb','#dcdfe3'];
const tstk=a=>`<div class="stk">${a.map((k,i)=>k?`<i style="flex:${k};background:${TYC[i]}" title="${TYP[i]} ${k}"></i>`:'').join('')}</div>`;
const chL=c=>c==='all'?'전체':'제'+c+'차';
const hts=(c,d)=>DB.T.filter(t=>t[2]===d&&(c==='all'||t[1]===c));
const opt=(a,v,l,n,on)=>`<button type="button" class="opt${on?' on':''}" data-act="${a}" data-v="${v}"><span>${l}</span><span class="c">${n}</span></button>`;
function renderHome(){
  const h5=H.cha==='5',n5=DOMS.reduce((a,d)=>a+PLAN5[d],0);
  const s1=[['all','전체(제1~4차)',DB.T.length],['1'],['2'],['3'],['4'],['5','제5차(준비 중)',n5]].map(([v,l,n])=>opt('cha',v,l||'제'+v+'차',n==null?DB.T.filter(t=>t[1]===v).length:n,H.cha===v)).join('');
  const s2=H.cha===null?'<div class="hint">1단계를 먼저 선택</div>':DOMS.map(d=>opt('dom',d,d+' '+DOMN[d],h5?PLAN5[d]:hts(H.cha,d).length,H.dom===d)).join('');
  let s3;
  if(H.dom===null)s3='<div class="hint">'+(H.cha===null?'1단계를 먼저 선택':'2단계를 먼저 선택')+'</div>';
  else if(h5)s3='<div class="hint">판정 준비 중</div>';
  else{const g=hts(H.cha,H.dom);s3=opt('stg','all','전체',g.length,H.stg==='all')+STG.map((s,i)=>opt('stg',i,NUM[i]+' '+s,g.filter(t=>t[4][i]==='1').length,H.stg===String(i))).join('');}
  const c=H.cha||'all',five=c==='5';
  const rows=DOMS.map(d=>{const g=hts(c,d),N=g.length||1;
    if(five)return `<div class="hrow" data-act="go" data-v="${d}"><div class="dn"><b style="font-weight:500">${d} ${DOMN[d]}</b><span>${PLAN5[d]}</span></div><div style="grid-column:2/4;color:var(--ink-3)">판정 준비 중</div></div>`;
    const sc=STG.map((x,i)=>g.filter(t=>t[4][i]==='1').length),tc=TYP.map((x,i)=>g.filter(t=>t[5][i]>0).length);
    return `<div class="hrow" data-act="go" data-v="${d}"><div class="dn"><b style="font-weight:500">${d} ${DOMN[d]}</b><span>${g.length}</span></div>`+
    `<div class="s5">${sc.map((k,i)=>`<div title="${STG[i]}"><div class="bk"><i style="width:${k/N*100}%;background:${STC[i]}"></i></div><small>${k}/${g.length}</small></div>`).join('')}</div>`+
    `<div><span class="tn" style="margin-top:0">${TYP.map((k,i)=>k+' '+tc[i]).join(' · ')}</span></div></div>`;}).join('');
  $('home').innerHTML=`<div class="hcard" style="margin-top:0"><h2>전체 현황</h2><div class="steps">`+
    `<div class="stp"><small>1단계 종합계획</small>${s1}</div><div class="stp"><small>2단계 도메인</small>${s2}</div><div class="stp"><small>3단계 정책 도달단계</small>${s3}</div></div>`+
    `<div class="hact"><button type="button" class="newbtn" data-act="show"${H.cha&&H.dom?'':' disabled'}>판정결과 보기</button></div></div>`+
    `<div class="hcard"><h2>도메인별 현황 <span style="font-weight:400;color:var(--ink-3)">· ${chL(c)}${five?' · 판정 준비 중':''}</span></h2><div class="hh"><span>도메인 · 과제 수</span><span>정책 도달단계</span><span>근거유형</span></div>${rows}</div>`;
}
function goDom(c,d,g){S.cha=c;S.dom=d;S.stg=g;S.typ='all';S.q='';$('q').value='';$('q2').value='';S.view='dom';render();}
function render(){
  const hm=S.view==='home';
  $('home').hidden=!hm;$('dview').hidden=hm;
  $('nav-home').className=hm?'cur':'';$('nav-tl').className=hm?'':'cur';
  $('nav-home').setAttribute('aria-current',hm?'page':'false');$('nav-tl').setAttribute('aria-current',hm?'false':'page');
  $('ttl').textContent=hm?'홈':S.dom+' '+DOMN[S.dom];$('dsel').hidden=hm;
  closePop();
  if(hm){renderHome();return;}
  renderControls();
  if(S.cha==='5'){renderSum([]);$('note').innerHTML='';
    $('tbl').innerHTML=`<div class="plan5"><b>제5차 종합계획 과제 · 판정 준비 중</b>${DOMS.map(d=>`${d} ${PLAN5[d]}`).join(' · ')}</div>`;return;}
  const ts=tasks();renderSum(ts);
  if(S.dom==='D1'){$('note').innerHTML='';$('tbl').innerHTML=timeline(ts);}
  else{$('note').innerHTML='<p class="note">근거 연도는 D1만 수록. 이 도메인은 과제 목록으로 표시.</p>';$('tbl').innerHTML=list(ts);}
}

$('guide').innerHTML=`<dl>${STG.map((s,i)=>`<dt>${NUM[i]} ${s}</dt><dd>${STGD[i]}</dd>`).join('')}</dl><dl>${TYP.map(c=>`<dt>${c} ${TYPN[c]}</dt><dd></dd>`).join('')}</dl>`;
$('b-guide').addEventListener('click',()=>{$('guide').hidden=!$('guide').hidden;});
$('nav-home').addEventListener('click',()=>{S.view='home';render();});
$('nav-tl').addEventListener('click',()=>{S.view='dom';render();});
$('nav-crit').addEventListener('click',()=>{S.view='dom';render();$('guide').hidden=false;});
$('home').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='cha'){H.cha=v;H.dom=null;H.stg=null;}
  else if(a==='dom'){H.dom=v;H.stg='all';}
  else if(a==='stg')H.stg=v;
  else if(a==='show'){goDom(H.cha,H.dom,H.stg==null?'all':H.stg);return;}
  else if(a==='go'){goDom(H.cha||'all',v,'all');return;}
  render();
});
$('b-all').addEventListener('click',()=>{S.cha='all';S.stg='all';S.typ='all';S.q='';$('q').value='';$('q2').value='';render();});
$('sel-dom').addEventListener('change',e=>{S.dom=e.target.value;render();});
$('sel-cha').addEventListener('change',e=>{S.cha=e.target.value;render();});
$('sel-stg').addEventListener('change',e=>{S.stg=e.target.value;render();});
$('sel-typ').addEventListener('change',e=>{S.typ=e.target.value;render();});
const qin=e=>{S.q=e.target.value;$('q').value=S.q;$('q2').value=S.q;render();};
$('q').addEventListener('input',qin);$('q2').addEventListener('input',qin);
$('u-year').addEventListener('click',()=>{S.unit='year';render();});
$('u-cha').addEventListener('click',()=>{S.unit='cha';render();});
$('tbl').addEventListener('click',e=>{
  const b=e.target.closest('.bar');if(!b)return;
  const id=b.dataset.id,a=+b.dataset.a;
  if(S.pop&&S.pop.id===id&&S.pop.a===a){closePop();return;}
  closePop();S.pop={id,a};b.classList.add('on');
  const p=$('pop');p.innerHTML=popHtml(id,a);p.hidden=false;
  const r=b.getBoundingClientRect(),w=300,h=Math.min(360,p.offsetHeight||300);
  let x=Math.min(Math.max(8,r.left),window.innerWidth-w-8),y=r.bottom+6;
  if(y+h>window.innerHeight-8)y=Math.max(8,r.top-h-6);
  p.style.left=x+'px';p.style.top=y+'px';
});
$('pop').addEventListener('click',e=>{if(e.target.closest('#pop-x'))closePop();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop();});
document.addEventListener('click',e=>{if(S.pop&&!e.target.closest('.pop')&&!e.target.closest('.bar'))closePop();});
window.addEventListener('scroll',closePop,{passive:true});
$('tbl').addEventListener('scroll',closePop,{passive:true});
render();
</script>

</body>
</html>
